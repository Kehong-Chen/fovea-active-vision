# /srv/dl 静态下载站：只有明确存在的文件能被访问，且 pdf 强制下载
server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /srv/dl;
    autoindex off;          # 关键：禁止列目录，否则等于公开整个目录
    charset utf-8;

    location / {
        try_files $uri =404;
    }

    location ~* \.pdf$ {
        try_files $uri =404;
        # 让浏览器"存盘"而不是在线预览
        add_header Content-Disposition "attachment";
        add_header Cache-Control "public, max-age=3600";
    }

    # 挡掉扫描器的常见探测路径
    location ~ /\. { return 404; }
}
